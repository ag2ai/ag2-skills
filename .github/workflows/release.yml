name: Release

# Pushing a tag "ag2-<version>" (e.g. ag2-1.3.0) publishes a GitHub Release with
# every skill zip attached. The tag must match COMPATIBILITY.json ag2_version and
# every SKILL.md metadata.ag2_version; zips must match their sources.

on:
  push:
    tags: ["ag2-*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate versions and tag
        run: python3 scripts/validate_versions.py --tag "${GITHUB_REF_NAME}"

      - name: Validate zips match sources
        run: python3 scripts/validate_zips.py

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" skills/*.zip \
            --title "Skills for AG2 ${GITHUB_REF_NAME#ag2-}" \
            --generate-notes
